# Fresh Breath - Sedona. The layout is shared (../layout.toml); the art in
# art/ and these colours come from the Sedona mockup (make-art.py).
extends = "../layout.toml"

[vars]
desktop_color = "#2c3d5d"   # the sky
title_on      = "#3e2217"   # text on the title paint (and the cream plate)
title_idle    = "#f4e9d1"   # text on the unfocused metal
rail_title    = "#beaba5"   # the spaced-out title on the toolbar rail
