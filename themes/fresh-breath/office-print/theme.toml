# Fresh Breath - Office Print. The layout is shared (../layout.toml); the art in
# art/ and these colours come from the Office Print mockup (make-art.py).
extends = "../layout.toml"

[vars]
desktop_color = "#46547a"   # the sky
title_on      = "#44373b"   # text on the title paint (and the cream plate)
title_idle    = "#f9f3e8"   # text on the unfocused metal
rail_title    = "#c3c0c4"   # the spaced-out title on the toolbar rail
