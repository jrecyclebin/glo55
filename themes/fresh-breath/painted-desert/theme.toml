# Fresh Breath - Painted Desert. The layout is shared (../layout.toml); the art in
# art/ and these colours come from the Painted Desert mockup (make-art.py).
extends = "../layout.toml"

[vars]
desktop_color = "#342b52"   # the sky
title_on      = "#433339"   # text on the title paint (and the cream plate)
title_idle    = "#f8ebda"   # text on the unfocused metal
rail_title    = "#b7b1bc"   # the spaced-out title on the toolbar rail
