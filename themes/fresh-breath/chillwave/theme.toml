# Fresh Breath - Chillwave. The layout is shared (../layout.toml); the art in
# art/ and these colours come from the Chillwave mockup (make-art.py).
extends = "../layout.toml"

[vars]
desktop_color = "#2a2259"   # the sky
title_on      = "#17212c"   # text on the title paint (and the cream plate)
title_idle    = "#f7e9ef"   # text on the unfocused metal
rail_title    = "#a2aab2"   # the spaced-out title on the toolbar rail
