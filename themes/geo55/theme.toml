# when = "pressed"
# left   = { edge = "right", offset = -20 }
# top    = { edge = "top",   offset = 4 }
# right  = { edge = "right", offset = -4 }
# bottom = { edge = "top",   offset = 26 }

# ---- toolbar: a floating, centred desk band ----
[[toolbars]]
monitor    = 0
height     = 30
align      = "left"
auto_width = true
width      = 100          # minimum; the bar grows with the clock and tabs

[toolbars.00_band]
type = "image"
path = "art/band.png"
scale = "slice"
slice = [2, 2, 2, 2]

[toolbars.01_gripper]
type = "image"
path = "art/gripper.png"
scale = "none"
left   = { edge = "left", offset = 4 }
top    = { edge = "top",  offset = 4 }
right  = { edge = "left", offset = 14 }
bottom = { edge = "top",  offset = 26 }

[toolbars.02_icon]
type = "image"
path = "art/jbin.png"
scale = "none"
left   = { edge = "left", offset = 20 }
top    = { edge = "top",  offset = 7 }
right  = { edge = "left", offset = 36 }
bottom = { edge = "top",  offset = 23 }

# Workspace tabs as small Win95 toggle buttons, growing the band to the right.
[toolbars.workspace_buttons]
left   = { edge = "left",   offset = 48 }
top    = { edge = "top",    offset = 4 }
right  = { edge = "right",  offset = -4 }
bottom = { edge = "bottom", offset = -4 }
align = "left"
spacing = 2
padding = 4
min_width = 22
button_height = 22

[toolbars.workspace_buttons.face]
type = "image"
path = "art/ws-idle.png"
scale = "slice"
slice = [4, 4, 4, 4]

[toolbars.workspace_buttons.face_occupied]
type = "image"
path = "art/ws-occupied.png"
scale = "slice"
slice = [4, 4, 4, 4]
when = "occupied"
unless = "active,pressed,hover"

[toolbars.workspace_buttons.face_hover]
type = "image"
path = "art/ws-hover.png"
scale = "slice"
slice = [4, 4, 4, 4]
when = "hover"
unless = "pressed,active"

[toolbars.workspace_buttons.face_active]
type = "image"
path = "art/ws-active.png"
scale = "slice"
slice = [4, 4, 4, 4]
when = "active"
unless = "pressed"

[toolbars.workspace_buttons.face_pressed]
type = "image"
path = "art/ws-pressed.png"
scale = "slice"
slice = [4, 4, 4, 4]
when = "pressed"

[toolbars.workspace_buttons.label]
type = "text"
content = "$workspace"
font = "$font"
size = 13
fore = "#000000"
shadow = "#FFFFFF"
align = "center"

# ---- toolbar: a floating, centred desk band ----
[[toolbars]]
monitor    = 0
height     = 30
align      = "right"
auto_width = true
width      = 270          # minimum; the bar grows with the clock and tabs

[toolbars.00_band]
type = "image"
path = "art/band.png"
scale = "slice"
slice = [2, 2, 2, 2]

[toolbars.01_gripper]
type = "image"
path = "art/gripper.png"
scale = "none"
left   = { edge = "left", offset = 4 }
top    = { edge = "top",  offset = 4 }
right  = { edge = "left", offset = 14 }
bottom = { edge = "top",  offset = 26 }

[toolbars.02_meter_well]
type = "image"
path = "art/meter-well.png"
scale = "none"
left   = { edge = "left", offset = 20 }
top    = { edge = "top",  offset = 6 }
right  = { edge = "left", offset = 92 }
bottom = { edge = "top",  offset = 24 }

# The fill's width is $cpu percent of this slot (LED tile, no filtering).
[toolbars.03_meter_fill]
type = "image"
path = "art/meter-fill.png"
scale = "none"
fill   = "$cpu"
left   = { edge = "left", offset = 23 }
top    = { edge = "top",  offset = 10 }
right  = { edge = "left", offset = 89 }
bottom = { edge = "top",  offset = 20 }

[toolbars.04_div]
type = "image"
path = "art/divider.png"
scale = "none"
left   = { edge = "left", offset = 96 }
top    = { edge = "top",  offset = 4 }
right  = { edge = "left", offset = 100 }
bottom = { edge = "top",  offset = 26 }

[toolbars.05_date]
type = "text"
content = "$date"
font = "$font"
size = 13
fore = "#000000"
shadow = "#FFFFFF"
align = "right"
left   = { edge = "left", offset = 104 }
top    = { edge = "top",  offset = 6 }
right  = { edge = "left", offset = 192 }
bottom = { edge = "top",  offset = 22 }

[toolbars.08_clock_back]
type = "image"
path = "art/clock-inset.png"
scale = "slice"
slice = [2, 2, 2, 2]
left   = { edge = "left", offset = 198 }
top    = { edge = "top",  offset = 4 }
right  = { edge = "left", offset = 264 }
bottom = { edge = "top",  offset = 26 }

[toolbars.09_clock]
type = "text"
content = "$time"
font = "$font:weight=bold"
size = 13
fore = "#CCCCCC"
align = "center"
left   = { edge = "left", offset = 202 }
top    = { edge = "top",  offset = 6 }
right  = { edge = "left", offset = 262 }
bottom = { edge = "top",  offset = 22 }
