# Fresh Breath - the layout the four palettes share (Sedona, Painted Desert,
# Chillwave, Office Print). Each palette's theme.toml `extends` this file and
# sets its colours under [vars]; image and font paths here are relative to the
# palette's own directory, so every palette brings its own art/.
#
# Sizes are the mockup's, pixel for pixel. A window is drawn as floating
# plates: the title row (stone, title plate, speed slashes, button plate) sits
# 4px above the frame, and the desktop shows through the gap. Edges lean 19°.
#
#   y 0..3    room for the register slip, which pokes 3px above the title
#   y 3..29   the title row, 26px
#   y 33..    the frame: 9px on the left (the reveal wedge), 5px elsewhere
#
# The title plate's length follows the window: 20% of its width plus 120px
# (the mockup's plates hug their text, which glo55 cannot measure). A title
# that does not fit ends in an ellipsis.

font_files        = ["../fonts/BarlowCondensed-SemiBoldItalic.ttf"]

[vars]
font        = "Barlow Condensed:style=SemiBold Italic"
state       = "unfocused"
title_color = "$title_idle"
label       = "$title_idle"

[[windows]]
window_gap       = 10
shaped           = true
collapsed_height = 39

[windows.insets]
left   = 9
top    = 38
right  = 5
bottom = 5

[windows.focused]
state       = "focused"
title_color = "$title_on"

# ---------------------------------------------------------------- frame

[windows.00_frame]
type   = "image"
path   = "art/$state/frame.png"
scale  = "slice"
slice  = [9, 5, 5, 5]
unless = "collapsed"
top    = { edge = "top", offset = 33 }

# The reveal wedge: the left edge thickens toward the bottom.
[windows.01_wedge]
type   = "image"
path   = "art/$state/wedge.png"
scale  = "stretch"
unless = "collapsed"
left   = { edge = "left", offset = 0 }
right  = { edge = "left", offset = 9 }
top    = { edge = "top", offset = 54 }
bottom = { edge = "bottom", offset = -5 }

# A rolled-up window keeps a thin bar of frame under its title row.
[windows.02_shaded_bar]
type   = "image"
path   = "art/shaded-bar.png"
scale  = "slice"
slice  = [12, 2, 12, 2]
when   = "collapsed"
top    = { edge = "top", offset = 33 }
bottom = { edge = "top", offset = 39 }

# ------------------------------------------------------------ title row

# The stone: the square plate left of the title (decoration, not a button).
[windows.10_stone]
type   = "image"
path   = "art/$state/stone.png"
left   = { edge = "left", offset = 0 }
right  = { edge = "left", offset = 30 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

# Focused: title paint, with the register slip 3px above and 4px right.
[windows.11_title]
type   = "image"
path   = "art/focused/title.png"
scale  = "slice"
slice  = [14, 3, 18, 3]
when   = "focused"
left   = { edge = "left", offset = 23 }
right  = { edge = "left", ratio = 0.2, offset = 124 }
top    = { edge = "top", offset = 0 }
bottom = { edge = "top", offset = 29 }

[windows.12_title_idle]
type   = "image"
path   = "art/unfocused/title.png"
scale  = "slice"
slice  = [12, 2, 12, 2]
unless = "focused"
left   = { edge = "left", offset = 23 }
right  = { edge = "left", ratio = 0.2, offset = 120 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

[windows.13_title_text]
type           = "text"
content        = "$title"
font           = "$font"
size           = 16
fore           = "$title_color"
transform      = "upper"
letter_spacing = 1
left           = { edge = "left", offset = 41 }
right          = { edge = "left", ratio = 0.2, offset = 108 }
top            = { edge = "top", offset = 5 }
bottom         = { edge = "top", offset = 29 }

# Speed slashes, right after the title plate: four stepping from warm to
# cool when focused, two plain ones when not.
[windows.14_slashes]
type   = "image"
path   = "art/$state/slashes.png"
left   = { edge = "left", ratio = 0.2, offset = 121 }
right  = { edge = "left", ratio = 0.2, offset = 179 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

# ------------------------------------------------------------ buttons
# The onyx plate, flush with the frame's right edge: collapse, fullscreen,
# close (the mockup's _ □ ×). A rolled-up window shows a chevron in place of
# the box. Close turns the title paint on hover and the slip paint when
# pressed, as on the parts sheet; the other two lift and sink.

[windows.20_buttons]
type   = "image"
path   = "art/buttons.png"
unless = "collapsed"
left   = { edge = "right", offset = -100 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

[windows.21_buttons_shaded]
type   = "image"
path   = "art/buttons-shaded.png"
when   = "collapsed"
left   = { edge = "right", offset = -100 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

# Hit areas: invisible, always there, so the pointer can find the buttons
# before their hover faces exist.
[windows.22_collapse_hit]
type   = "solid"
fore   = "#00000000"
action = "collapse"
left   = { edge = "right", offset = -84 }
right  = { edge = "right", offset = -60 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

[windows.22_fullscreen_hit]
type   = "solid"
fore   = "#00000000"
action = "fullscreen"
left   = { edge = "right", offset = -60 }
right  = { edge = "right", offset = -36 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

[windows.22_close_hit]
type   = "solid"
fore   = "#00000000"
action = "close"
left   = { edge = "right", offset = -36 }
right  = { edge = "right", offset = -12 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

[windows.23_collapse]
type   = "image"
path   = "art/btn-collapse-hover.png"
action = "collapse"
when   = "hover"
unless = "pressed"
left   = { edge = "right", offset = -84 }
right  = { edge = "right", offset = -60 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

[windows.24_collapse_pressed]
type   = "image"
path   = "art/btn-collapse-pressed.png"
action = "collapse"
when   = "pressed"
left   = { edge = "right", offset = -84 }
right  = { edge = "right", offset = -60 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

[windows.25_fullscreen]
type   = "image"
path   = "art/btn-fullscreen-hover.png"
action = "fullscreen"
when   = "hover"
unless = "pressed"
left   = { edge = "right", offset = -60 }
right  = { edge = "right", offset = -36 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

[windows.26_fullscreen_pressed]
type   = "image"
path   = "art/btn-fullscreen-pressed.png"
action = "fullscreen"
when   = "pressed"
left   = { edge = "right", offset = -60 }
right  = { edge = "right", offset = -36 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

[windows.27_close]
type   = "image"
path   = "art/btn-close-hover.png"
action = "close"
when   = "hover"
unless = "pressed"
left   = { edge = "right", offset = -36 }
right  = { edge = "right", offset = -12 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

[windows.28_close_pressed]
type   = "image"
path   = "art/btn-close-pressed.png"
action = "close"
when   = "pressed"
left   = { edge = "right", offset = -36 }
right  = { edge = "right", offset = -12 }
top    = { edge = "top", offset = 3 }
bottom = { edge = "top", offset = 29 }

# ---------------------------------------------------------------- toolbar
# Clock plate (title paint and slip) on the left, four speed slashes, the
# rail across the screen with the focused window's title spaced out on it,
# and the workspace plates on the right (the current one in cream). The bar
# is an opaque window, so the space around the plates is filled with the
# palette's sky and print grain, over the desktop's flat sky colour.

[[toolbars]]
height = 30

[toolbars.00_sky]
type = "pattern"
path = "art/sky.png"

[toolbars.01_rail]
type   = "image"
path   = "art/rail.png"
scale  = "stretch"
top    = { edge = "top", offset = 9 }
bottom = { edge = "top", offset = 23 }

[toolbars.02_rail_title]
type      = "text"
content   = "$title"
font      = "$font"
size      = 10
fore      = "$rail_title"
transform = "upper"
letter_spacing = 3
align     = "center"
left      = { edge = "left", offset = 240 }
right     = { edge = "right", offset = -240 }
top       = { edge = "top", offset = 9 }
bottom    = { edge = "top", offset = 23 }

[toolbars.03_clock]
type   = "image"
path   = "art/clock.png"
left   = { edge = "left", offset = 0 }
right  = { edge = "left", offset = 154 }
top    = { edge = "top", offset = 1 }
bottom = { edge = "top", offset = 28 }

[toolbars.04_time]
type    = "text"
content = "$time"
font    = "$font"
size    = 20
fore    = "$title_on"
left    = { edge = "left", offset = 15 }
right   = { edge = "left", offset = 62 }
top     = { edge = "top", offset = 5 }
bottom  = { edge = "top", offset = 28 }

[toolbars.05_date]
type           = "text"
content        = "$date"
font           = "$font"
size           = 12
fore           = "$title_on"
transform      = "upper"
letter_spacing = 1
left           = { edge = "left", offset = 59 }
right          = { edge = "left", offset = 140 }
top            = { edge = "top", offset = 8 }
bottom         = { edge = "top", offset = 28 }

[toolbars.06_slashes]
type   = "image"
path   = "art/tb-slashes.png"
left   = { edge = "left", offset = 151 }
right  = { edge = "left", offset = 207 }
top    = { edge = "top", offset = 4 }
bottom = { edge = "top", offset = 28 }

# The plates lean into each other (spacing -12 leaves the mockup's thin seam);
# the region runs 6px past the screen edge so the last plate ends flush.
[toolbars.workspace_buttons]
left          = { edge = "right", offset = -400 }
right         = { edge = "right", offset = 6 }
top           = { edge = "top", offset = 4 }
bottom        = { edge = "top", offset = 28 }
align         = "right"
spacing       = -12
padding       = 15
min_width     = 48
max_width     = 110
button_height = 24

[toolbars.workspace_buttons.active]
label = "$title_on"

[toolbars.workspace_buttons.00_idle]
type   = "image"
path   = "art/ws-idle.png"
scale  = "slice"
slice  = [12, 2, 12, 2]
unless = "active,hover,pressed"

[toolbars.workspace_buttons.01_hover]
type   = "image"
path   = "art/ws-hover.png"
scale  = "slice"
slice  = [12, 2, 12, 2]
when   = "hover"
unless = "active"

[toolbars.workspace_buttons.02_pressed]
type   = "image"
path   = "art/ws-pressed.png"
scale  = "slice"
slice  = [12, 2, 12, 2]
when   = "pressed"

[toolbars.workspace_buttons.03_active]
type   = "image"
path   = "art/ws-active.png"
scale  = "slice"
slice  = [18, 2, 12, 2]
when   = "active"
unless = "pressed"

[toolbars.workspace_buttons.04_label]
type    = "text"
content = "$workspace"
font    = "$font"
size    = 17
fore    = "$label"
align   = "center"
left    = { edge = "left", offset = 4 }
right   = { edge = "right", offset = -4 }
top     = { edge = "top", offset = 2 }
bottom  = { edge = "bottom", offset = 0 }
